name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aidesk_test
          MYSQL_USER: aidesk
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: testing
      APP_NAME: AIDesk Chat Center
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: aidesk_test
      DB_USERNAME: aidesk
      DB_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: predis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: aidesk-ci
      REVERB_APP_KEY: aidesk-ci-public
      REVERB_APP_SECRET: ci-only-reverb-secret
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl, zip, bcmath, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: php artisan migrate --force
      - run: vendor/bin/pest --exclude-group=infrastructure
      - run: vendor/bin/pest --group=infrastructure -c phpunit.infrastructure.xml
      - run: php artisan db:seed --class=E2ESeeder --force
      - run: npx playwright install --with-deps chromium
      - name: Start application and Reverb
        run: |
          APP_ENV=local php artisan serve --host=127.0.0.1 --port=8000 > /tmp/aidesk-http.log 2>&1 &
          php artisan reverb:start --host=127.0.0.1 --port=8080 > /tmp/aidesk-reverb.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail -s http://127.0.0.1:8000/up && break || sleep 1; done
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            test-results
            storage/logs
            /tmp/aidesk-http.log
            /tmp/aidesk-reverb.log
