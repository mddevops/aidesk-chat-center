x-app: &app
  image: aidesk-php:8.3
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    secrets: [proxy_ca]
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  volumes: [.:/app]
  env_file: .env
  environment:
    NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},mysql,redis,reverb,app
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  app:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=60 --sleep=1
  scheduler:
    <<: *app
    command: php artisan schedule:work
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["127.0.0.1:8080:8080"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
  redis-data:
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}
